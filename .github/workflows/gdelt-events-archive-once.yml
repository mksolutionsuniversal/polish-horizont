name: GDELT Events archive once (TEMPORARY)

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: read

jobs:
  events-once:
    if: github.event.pull_request.head.ref == 'probe/gdelt-events-once-20261020' && github.event.pull_request.head.repo.full_name == 'mksolutionsuniversal/polish-horizont'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: At most one manifest and one small Events ZIP, isolated ephemeral files
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import tempfile
          import urllib.request
          import urllib.error
          from urllib.parse import urlsplit
          from horizont.adapters.gdelt_raw import parse_manifest, parse_zip_rows, GDELTRawError

          MANIFEST_URL = 'https://data.gdeltproject.org/gdeltv2/lastupdate.txt'
          HOST = 'data.gdeltproject.org'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('redirect blocked')
          opener = urllib.request.build_opener(NoRedirect())
          count = 0
          def single_read(url, max_bytes):
              global count
              parts = urlsplit(url)
              if parts.scheme != 'https' or parts.netloc != HOST or not parts.path.startswith('/gdeltv2/'):
                  raise SystemExit('NOT_ALLOWED_URL')
              count += 1
              if count > 2:
                  raise SystemExit('REQUEST_BUDGET_EXHAUSTED')
              req = urllib.request.Request(url, headers={'Accept': '*/*',
                  'User-Agent': 'HORIZONT-private-raw-events-one-shot/0.1'})
              try:
                  with opener.open(req, timeout=12) as response:
                      status = response.status
                      body = response.read(max_bytes + 1)
              except urllib.error.HTTPError as exc:
                  print('HTTP_ERROR:', exc.code)
                  raise SystemExit(4)
              except (urllib.error.URLError, OSError, TimeoutError, RuntimeError) as exc:
                  print('TRANSPORT_ERROR:', type(exc).__name__)
                  raise SystemExit(5)
              if len(body) > max_bytes:
                  print('BODY_EXCEEDS_BUDGET')
                  raise SystemExit(6)
              print('HTTP:', status, 'bytes:', len(body))
              return body

          manifest_data = single_read(MANIFEST_URL, 4096)
          try:
              manifest = parse_manifest(manifest_data, stream='english')
          except GDELTRawError as exc:
              print('MANIFEST_FAIL:', str(exc))
              raise SystemExit(7)
          boundary = datetime.strptime(manifest.timestamp, '%Y%m%d%H%M%S').replace(tzinfo=timezone.utc)
          age = (datetime.now(timezone.utc) - boundary).total_seconds()
          print('BOUNDARY:', manifest.timestamp, 'age_seconds_rounded:', round(age))
          if not -900 <= age <= 86400:
              print('FRESHNESS_WINDOW_REJECT')
              raise SystemExit(8)
          entry = manifest.entries[0]
          if entry.kind != 'events' or entry.compressed_bytes > 1048576:
              print('EVENTS_COMPRESSED_CAP_ABORT:', entry.kind, entry.compressed_bytes)
              raise SystemExit(9)
          print('EXPECTED_EVENTS_COMPRESSED_BYTES:', entry.compressed_bytes)
          content = single_read(entry.url, 1048576)
          with tempfile.TemporaryDirectory() as tmp:
              archive = Path(tmp) / 'events.zip'
              archive.write_bytes(content)
              try:
                  rows = parse_zip_rows(archive, entry, max_uncompressed_bytes=8*1024*1024, max_rows=5000)
              except GDELTRawError as exc:
                  print('ZIP_OR_TABLE_REJECTED:', str(exc))
                  raise SystemExit(10)
              widths = sorted(set(len(row) for row in rows))
              print('VERIFIED_ZIP_MD5_AND_MEMBER: PASS')
              print('VALIDATED_ROW_COUNT:', len(rows))
              print('TSV_COLUMN_COUNTS:', ','.join(map(str, widths)))
          print('ZIP_FILES_RETAINED: 0')
          print('SQLITE_WRITES: 0')
          print('TOTAL_HTTP_GETS:', count)
          PY
