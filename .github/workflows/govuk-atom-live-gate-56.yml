name: GOV.UK Atom one-shot format gate 56

on:
  push:
    branches:
      - gate/govuk-atom-once-20261023-56
    paths:
      - .github/workflows/govuk-atom-live-gate-56.yml

permissions:
  contents: read

concurrency:
  group: govuk-atom-one-shot-issue-56
  cancel-in-progress: true

jobs:
  single-get:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read-only checkout for existing parser
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Probe with one bounded HTTPS GET, no retries or redirects
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          import datetime
          import os
          import re
          import signal
          import socket
          import ssl
          import sys
          import time
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          if os.environ.get("GITHUB_RUN_ATTEMPT") != "1" or os.environ.get("GITHUB_RUN_NUMBER") != "1":
              print("RESULT=SKIPPED_NON_FIRST_RUN")
              sys.exit(0)

          sys.path.insert(0, "src")
          from horizont.adapters.govuk_atom import GOVUKAtomError, parse_feed

          TARGET = "https://www.gov.uk/search/news-and-communications.atom"
          LIMIT_BYTES = 128 * 1024
          ATOM = "{http://www.w3.org/2005/Atom}"
          started = time.monotonic()

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def timeout_handler(signum, frame):
              raise TimeoutError("hard deadline")

          signal.signal(signal.SIGALRM, timeout_handler)
          signal.alarm(12)

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              NoRedirect(),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
          )
          request = urllib.request.Request(
              TARGET,
              headers={
                  "User-Agent": "POLISH-HORIZONT-OSINT-LAB/1.0 (one-off format check; github.com/mksolutionsuniversal/polish-horizont)",
                  "Accept": "application/atom+xml",
              },
              method="GET",
          )
          print("TARGET_HOST=www.gov.uk")
          print("REQUEST_LIMIT=ONE_GET")
          print("MAX_RESPONSE_BYTES=131072")
          print("REDIRECTS=DISABLED")
          print("PROXIES=DISABLED")
          print("RETRIES=DISABLED")
          print("BODY_PERSISTENCE=NONE")
          try:
              with opener.open(request, timeout=8) as response:
                  status = response.status
                  content_type = response.headers.get_content_type()
                  declared_length = response.headers.get("Content-Length", "")
                  print(f"HTTP_STATUS={status}")
                  print(f"MEDIA_TYPE={content_type}")
                  if re.fullmatch(r"[0-9]{1,10}", declared_length):
                      print(f"CONTENT_LENGTH_HEADER={declared_length}")
                  if status != 200:
                      print("RESULT=HTTP_NON_200")
                      sys.exit(0)
                  body = response.read(LIMIT_BYTES + 1)

              print(f"READ_BYTES={len(body)}")
              if len(body) > LIMIT_BYTES:
                  print("RESULT=BODY_LIMIT_EXCEEDED")
                  sys.exit(0)
              if content_type not in ("application/atom+xml", "application/xml", "text/xml"):
                  print("RESULT=UNEXPECTED_MEDIA_TYPE")
                  sys.exit(0)
              try:
                  root = ET.fromstring(body)
              except ET.ParseError:
                  print("RESULT=MALFORMED_XML")
                  sys.exit(0)
              print(f"ATOM_FEED_ROOT={root.tag == ATOM + 'feed'}")
              print(f"ATOM_ENTRY_COUNT={len(root.findall(ATOM + 'entry'))}")
              print(f"FEED_HAS_ID={root.find(ATOM + 'id') is not None}")
              print(f"FEED_HAS_TITLE={root.find(ATOM + 'title') is not None}")
              print(f"FEED_HAS_UPDATED={root.find(ATOM + 'updated') is not None}")
              try:
                  batch = parse_feed(
                      body,
                      collected_at=datetime.datetime.now(datetime.timezone.utc),
                  )
              except GOVUKAtomError as exc:
                  print(f"PARSER_ERROR_TYPE={type(exc).__name__}")
                  print("RESULT=OFFLINE_PARSER_CONTRACT_MISMATCH")
                  sys.exit(0)
              print(f"PARSER_ACCEPTED_ENTRIES={len(batch.publications)}")
              print("RESULT=LIVE_FORMAT_COMPATIBLE_AT_THIS_SNAPSHOT")
          except urllib.error.HTTPError as exc:
              print(f"HTTP_STATUS={exc.code}")
              print("RESULT=HTTP_NON_200_OR_REDIRECT")
          except (urllib.error.URLError, socket.timeout, TimeoutError) as exc:
              print(f"TRANSPORT_ERROR_TYPE={type(exc).__name__}")
              print("RESULT=TRANSPORT_BLOCKED")
          finally:
              signal.alarm(0)
              print(f"ELAPSED_SECONDS={time.monotonic() - started:.2f}")
          PY