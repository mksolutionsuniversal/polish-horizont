name: GDELT raw manifest one-shot (TEMPORARY)

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: read

jobs:
  manifest-once:
    if: github.event.pull_request.head.ref == 'probe/gdelt-raw-manifest-once-20261020' && github.event.pull_request.head.repo.full_name == 'mksolutionsuniversal/polish-horizont'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: One HTTPS GET of small raw manifest; no ZIP or article requests
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.error
          from horizont.adapters.gdelt_raw import parse_manifest, GDELTRawError

          URL = 'https://data.gdeltproject.org/gdeltv2/lastupdate.txt'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('redirect blocked')

          request = urllib.request.Request(URL, headers={
              'Accept': 'text/plain',
              'User-Agent': 'HORIZONT-private-raw-feasibility-once/0.1'
          })
          print('GATE: raw manifest, exactly one HTTPS request, no redirects/retries')
          try:
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=12) as response:
                  status = response.status
                  content = response.read(4097)
                  print('HTTP_STATUS:', status)
                  print('RESPONSE_BYTES:', len(content))
          except urllib.error.HTTPError as exc:
              print('HTTP_ERROR:', exc.code)
              raise SystemExit(4)
          except (urllib.error.URLError, OSError, TimeoutError, RuntimeError) as exc:
              print('TRANSPORT_ERROR:', type(exc).__name__)
              raise SystemExit(5)
          if len(content) > 4096:
              print('GATE_ABORT: >4096 bytes')
              raise SystemExit(6)
          try:
              manifest = parse_manifest(content, stream='english')
          except GDELTRawError as exc:
              print('PARSER_REJECTED:', str(exc).split(':', 1)[0])
              raise SystemExit(7)
          print('PARSER: PASS')
          print('BOUNDARY_UTC:', manifest.timestamp)
          print('KIND_COUNT:', len(manifest.entries))
          for entry in manifest.entries:
              print('ARCHIVE_KIND_SIZE:', entry.kind, entry.compressed_bytes)
              print('CANONICAL_HTTPS:', entry.url.startswith('https://data.gdeltproject.org/'))
          print('ZIP_DOWNLOADS: 0')
          PY
