name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check repository hygiene
        run: python3 tools/check_repo_hygiene.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate Docker LAB Compose syntax (no containers run)
        run: docker compose --env-file /dev/null -p horizont-lab -f deploy/lab/compose.yaml config --quiet
