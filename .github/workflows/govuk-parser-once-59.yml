name: GOV.UK Atom parser compatibility one-shot #59

on:
  push:
    branches:
      - gate/govuk-parser-live-once-20261023-59
    paths:
      - .github/workflows/govuk-parser-once-59.yml

permissions:
  contents: read

concurrency:
  group: govuk-atom-parser-one-shot-59
  cancel-in-progress: true

jobs:
  read-only-one-get:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout parser code without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate parser identity and perform one HTTPS GET
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          import datetime
          import os
          import pathlib
          import re
          import signal
          import socket
          import ssl
          import sys
          import time
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          # Complete no-op on any rerun. No retry, polling, or redirect.
          if os.getenv("GITHUB_RUN_NUMBER") != "1" or os.getenv("GITHUB_RUN_ATTEMPT") != "1":
              print("RESULT=NO_OP_RERUN")
              sys.exit(0)

          sys.path.insert(0, "src")
          from horizont.adapters.govuk_atom import (
              MAX_ENTRIES, MAX_XML_BYTES, GOVUKAtomError, parse_feed
          )
          assert MAX_ENTRIES == 20 and MAX_XML_BYTES == 128 * 1024

          TARGET = "https://www.gov.uk/search/news-and-communications.atom"
          ATOM = "{http://www.w3.org/2005/Atom}"
          started = time.monotonic()

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def alarm_handler(signum, frame):
              raise TimeoutError("hard deadline reached")

          def safe_parser_category(exc):
              text = str(exc)
              candidates = (
                  ("feed exceeds", "feed_entry_limit"),
                  ("XML exceeds", "feed_byte_limit"),
                  ("malformed Atom XML", "malformed_xml"),
                  ("root element", "namespace_or_root"),
                  ("outside the Atom", "entry_namespace"),
                  ("DTD and entity", "forbidden_declaration"),
                  ("duplicates an Atom id", "duplicate_atom_id"),
                  ("duplicates a title", "duplicate_title"),
                  ("duplicates a canonical", "duplicate_url"),
                  ("alternate article link", "invalid_alternate_link"),
                  ("approved publisher host", "unapproved_url_host"),
                  ("article URL", "unsafe_url"),
                  ("timestamp", "timestamp_format"),
                  ("missing Atom", "missing_required_field"),
                  ("empty Atom", "empty_required_field"),
              )
              for token, category in candidates:
                  if token in text:
                      return category
              return "other_contract_validation"

          print("GATE=GOVUK_ATOM_PARSER_59")
          print("MAIN_SQUASH_SHA=675dd8d6a26bb00119dbbf69897aaee4c0edfa35")
          print("ALLOWED_HOST=www.gov.uk")
          print("MAX_HTTPS_GET=1")
          print("REDIRECTS=NO")
          print("PROXIES=NO")
          print("RETRIES=NO")
          print("LOG_REAL_FIELDS=NO")
          print(f"MAX_RESPONSE_BYTES={MAX_XML_BYTES}")
          print(f"PARSER_MAX_ENTRIES={MAX_ENTRIES}")

          signal.signal(signal.SIGALRM, alarm_handler)
          signal.alarm(12)
          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              NoRedirect(),
              urllib.request.HTTPSHandler(context=ssl.create_default_context())
          )
          req = urllib.request.Request(
              TARGET,
              method="GET",
              headers={
                  "User-Agent": "POLISH-HORIZONT-OSINT-LAB/1.0 (one-shot no-storage test; github.com/mksolutionsuniversal/polish-horizont)",
                  "Accept": "application/atom+xml",
                  "Accept-Encoding": "identity",
              }
          )
          try:
              with opener.open(req, timeout=8) as resp:
                  print(f"HTTP_STATUS={resp.status}")
                  media_type = resp.headers.get_content_type()
                  print(f"MEDIA_TYPE={media_type}")
                  content_encoding = resp.headers.get("Content-Encoding", "identity").lower()
                  print(f"CONTENT_ENCODING_IDENTITY={content_encoding == 'identity'}")
                  content_length = resp.headers.get("Content-Length", "")
                  if re.fullmatch(r"[0-9]{1,10}", content_length):
                      print(f"CONTENT_LENGTH_HEADER={content_length}")
                  if resp.status != 200:
                      print("RESULT=HTTP_NON_200")
                      sys.exit(0)
                  if content_encoding != "identity":
                      print("RESULT=UNEXPECTED_CONTENT_ENCODING")
                      sys.exit(0)
                  body = resp.read(MAX_XML_BYTES + 1)

              print(f"READ_BYTES={len(body)}")
              if len(body) > MAX_XML_BYTES:
                  print("RESULT=OVER_LIMIT_BYTES")
                  sys.exit(0)
              if media_type not in ("application/atom+xml", "application/xml", "text/xml"):
                  print("RESULT=INVALID_MEDIA_TYPE")
                  sys.exit(0)
              if re.search(rb"<!\s*(?:DOCTYPE|ENTITY)\b", body, re.IGNORECASE):
                  print("RESULT=FORBIDDEN_DECLARATION")
                  sys.exit(0)
              try:
                  root = ET.fromstring(body)
              except ET.ParseError:
                  print("RESULT=MALFORMED_XML")
                  sys.exit(0)
              print(f"ROOT_IS_ATOM_FEED={root.tag == ATOM + 'feed'}")
              print(f"ATOM_ENTRIES={len(root.findall(ATOM + 'entry'))}")
              print(f"HAS_FEED_ID={root.find(ATOM + 'id') is not None}")
              print(f"HAS_FEED_TITLE={root.find(ATOM + 'title') is not None}")
              print(f"HAS_FEED_UPDATED={root.find(ATOM + 'updated') is not None}")
              try:
                  parsed = parse_feed(
                      body, collected_at=datetime.datetime.now(datetime.timezone.utc)
                  )
              except GOVUKAtomError as exc:
                  print(f"PARSER_ERROR_CATEGORY={safe_parser_category(exc)}")
                  print("RESULT=LIVE_PARSER_CONTRACT_MISMATCH")
                  sys.exit(0)
              print(f"PARSER_ACCEPTED_COUNT={len(parsed.publications)}")
              print(f"ALL_VALIDATION_PENDING={all(p.validation_status == 'pending' for p in parsed.publications)}")
              print(f"ALL_GEO_UNKNOWN={all(p.latitude is None and p.longitude is None and p.geo_precision == 'unknown' for p in parsed.publications)}")
              print(f"ALL_OCCURRENCE_UNKNOWN={all(p.occurred_at is None for p in parsed.publications)}")
              print("RESULT=LIVE_PARSER_PASS")
          except urllib.error.HTTPError as exc:
              print(f"HTTP_STATUS={exc.code}")
              print("RESULT=HTTP_ERROR_OR_REDIRECT")
          except (urllib.error.URLError, socket.timeout, TimeoutError) as exc:
              print(f"TRANSPORT_ERROR_CLASS={type(exc).__name__}")
              print("RESULT=TRANSPORT_FAILURE")
          finally:
              signal.alarm(0)
              print(f"ELAPSED_SECONDS={time.monotonic()-started:.2f}")
          PY