# LAB ONLY — no external/public access; do not add production data.
name: horizont-lab

services:
  preview:
    build:
      context: ../..
      dockerfile: deploy/lab/Dockerfile.preview
    image: horizont-preview:lab
    restart: "no"
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "127.0.0.1:${HORIZONT_LAB_PORT:-15480}:8080"
    networks:
      - preview_only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2).close()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  preview_only:
    internal: true
